<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 760" width="100%" height="100%">
  <defs>
    <style type="text/css">
<![CDATA[
    svg { background-color: #ffffff; }
    .title-main { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 28px; font-weight: 800; fill: #1e293b; letter-spacing: -0.5px; }
    .title-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13.5px; fill: #475569; }
    .entity-box { fill: #f1f5f9; stroke: #334155; stroke-width: 1.6px; rx: 4px; ry: 4px; }
    .entity-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .entity-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10.5px; font-weight: 600; fill: #475569; text-anchor: middle; }
    .proc-bg { fill: #ffffff; stroke: #2563eb; stroke-width: 1.8px; rx: 8px; ry: 8px; }
    .proc-header { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.8px; }
    .proc-bottom { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.8px; }
    .proc-id-box { fill: #2563eb; stroke: #1d4ed8; stroke-width: 1.4px; rx: 3px; }
    .proc-id-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 800; fill: #ffffff; text-anchor: middle; }
    .proc-name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .store-id-box { fill: #475569; stroke: #334155; stroke-width: 1.6px; }
    .store-id-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 800; fill: #ffffff; text-anchor: middle; }
    .store-body { fill: #f8fafc; stroke: #475569; stroke-width: 1.6px; }
    .store-name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .flow-line { fill: none; stroke: #2563eb; stroke-width: 1.6px; stroke-linejoin: round; stroke-linecap: round; }
    .flow-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 8.5px; font-weight: 700; fill: #0f172a; letter-spacing: 0.3px; }
    .context-process { fill: #ffffff; stroke: #2563eb; stroke-width: 2.5px; }
    .context-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14.5px; font-weight: 800; fill: #1e3a8a; text-anchor: middle; }
    .context-id { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 800; fill: #2563eb; text-anchor: middle; }
    .footer-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 8.5px; font-weight: 600; fill: #94a3b8; text-anchor: end; letter-spacing: 0.5px; }
]]>
    </style>
  </defs>
  <!-- Pure White Clean Background for Easy Copying into Documents -->
  <rect width="100%" height="100%" fill="#ffffff" />
  <defs>
    <marker id="a0" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 1.5L8 5 0 8.5z" fill="#2563eb"/></marker>
    
  </defs>
  
  

  <!-- Header -->
  <text x="570" y="60" class="title-main" text-anchor="middle">Context Diagram (Level 0)</text>
  <text x="570" y="82" class="title-sub" text-anchor="middle">PowerForecast Refine v3.7.2 — Updated boundary with Room-Code collaboration, dual OCR, PC TDP/TGP, and bottom-up MAPE reconciliation.</text>

  <!-- Central Process 0 -->
  <circle cx="570" cy="410" r="100" class="context-process"/>
  <text x="570" y="395" class="context-text">PowerForecast</text>
  <text x="570" y="415" class="context-text">Refine System</text>
  <text x="570" y="435" class="context-id">0 (v3.7.2+)</text>

  <!-- External Entities -->
  <!-- Top Row Left: Gemini Vision AI -->
  <rect x="180" y="110" width="180" height="52" class="entity-box" rx="3"/>
  <text x="270" y="134" class="entity-text">Gemini Vision AI</text>
  <text x="270" y="150" class="entity-sub">Multimodal 2.0 Flash</text>

  <!-- Top Row Center-Left: Tesseract.js Client OCR (NEW) -->
  <rect x="400" y="110" width="170" height="52" class="entity-box" rx="3"/>
  <text x="485" y="134" class="entity-text">Tesseract.js OCR</text>
  <text x="485" y="150" class="entity-sub">Client In-Browser Fallback</text>

  <!-- Top Row Center-Right: DOE PELP Registry -->
  <rect x="610" y="110" width="170" height="52" class="entity-box" rx="3"/>
  <text x="695" y="134" class="entity-text">DOE PELP Registry</text>
  <text x="695" y="150" class="entity-sub">6,800+ Certified Ratings</text>

  <!-- Top Row Right: PC Hardware Registry (NEW) -->
  <rect x="820" y="110" width="170" height="52" class="entity-box" rx="3"/>
  <text x="905" y="134" class="entity-text">PC Hardware Specs</text>
  <text x="905" y="150" class="entity-sub">CPU TDP &amp; GPU TGP</text>

  <!-- Left Row: User / Primary Consumer -->
  <rect x="40" y="270" width="180" height="56" class="entity-box" rx="3"/>
  <text x="130" y="296" class="entity-text">User / Consumer</text>
  <text x="130" y="312" class="entity-sub">Account Owner &amp; Admin</text>

  <!-- Left Row 2: Room Members / Collaborators (NEW) -->
  <rect x="40" y="390" width="180" height="56" class="entity-box" rx="3"/>
  <text x="130" y="416" class="entity-text">Room Collaborators</text>
  <text x="130" y="432" class="entity-sub">Household Members (PF-XXXXXX)</text>

  <!-- Left Row 3: Electric Utility (Meralco) -->
  <rect x="40" y="550" width="180" height="56" class="entity-box" rx="3"/>
  <text x="130" y="575" class="entity-text">Electric Utility</text>
  <text x="130" y="591" class="entity-sub">Meralco / ERC Matrix</text>

  <!-- Right: Notification Services -->
  <rect x="890" y="380" width="190" height="56" class="entity-box" rx="3"/>
  <text x="985" y="405" class="entity-text">Notification Services</text>
  <text x="985" y="421" class="entity-sub">Web Push &amp; Resend Email</text>

  <!-- FLOWS -->
  <!-- User -> System -->
  <line x1="220" y1="285" x2="475" y2="370" class="flow-line" marker-end="url(#a0)"/>
  <text x="250" y="278" class="flow-text">1-3 STAGED PHOTOS, PC SPECS, ROUTINES, ACTUAL BILL</text>

  <!-- System -> User -->
  <line x1="475" y1="410" x2="220" y2="310" class="flow-line" marker-end="url(#a0)"/>
  <text x="240" y="390" class="flow-text">LIVE TELEMETRY, 24H CURVE, ERC BILL, MAPE SCORE (≥90%), AI TIPS</text>

  <!-- Room Member -> System -->
  <line x1="220" y1="415" x2="470" y2="425" class="flow-line" marker-end="url(#a0)"/>
  <text x="235" y="433" class="flow-text">6-CHAR ROOM CODE (PF-XXXXXX), APPLIANCE PROPOSALS</text>

  <!-- System -> Room Member -->
  <path d="M472 445 L260 445 L260 435 L220 435" class="flow-line" marker-end="url(#a0)"/>
  <text x="245" y="460" class="flow-text">SCOPED ROOM TELEMETRY (VIEW-ONLY)</text>

  <!-- Gemini -> System -->
  <line x1="300" y1="162" x2="520" y2="320" class="flow-line" marker-end="url(#a0)"/>
  <text x="325" y="225" class="flow-text">MULTIMODAL OCR SPECS</text>

  <!-- Tesseract -> System -->
  <line x1="490" y1="162" x2="550" y2="310" class="flow-line" marker-end="url(#a0)"/>
  <text x="495" y="220" class="flow-text">LOCAL OCR FALLBACK</text>

  <!-- DOE PELP -> System -->
  <line x1="680" y1="162" x2="590" y2="315" class="flow-line" marker-end="url(#a0)"/>
  <text x="645" y="220" class="flow-text">CSPF &amp; STAR RATINGS</text>

  <!-- PC Hardware -> System -->
  <line x1="870" y1="162" x2="650" y2="340" class="flow-line" marker-end="url(#a0)"/>
  <text x="760" y="240" class="flow-text">TDP/TGP BENCHMARKS</text>

  <!-- Utility -> System -->
  <line x1="220" y1="565" x2="480" y2="465" class="flow-line" marker-end="url(#a0)"/>
  <text x="240" y="555" class="flow-text">UNBUNDLED TARIFF SCHEDULES</text>

  <!-- System -> Utility -->
  <line x1="480" y1="485" x2="220" y2="585" class="flow-line" marker-end="url(#a0)"/>
  <text x="240" y="605" class="flow-text">ESTIMATED GRID DEMAND</text>

  <!-- System -> Notification -->
  <line x1="670" y1="410" x2="882" y2="410" class="flow-line" marker-end="url(#a0)"/>
  <text x="690" y="403" class="flow-text">BUDGET, PEAK WINDOWS &amp; CRUISING ALERTS</text>

  <text x="1080" y="725" class="footer-text">© 2026 POWERFORECAST REFINE — LEVEL 0 CONTEXT DIAGRAM</text>
</svg>