  <!-- Pure White Clean Background for Easy Copying into Documents -->
  <rect width="100%" height="100%" fill="#ffffff" />
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 1.5L8 5 0 8.5z" fill="#2563eb"/></marker>
    
  </defs>
  
  

  <text x="570" y="60" class="title-main" text-anchor="middle">Level 2 DFD — Process 3 Decomposition</text>
  <text x="570" y="82" class="title-sub" text-anchor="middle">Daily Telemetry &amp; Smart Calendar: Live Power Board, Inverter Cruising Alerts, Dual-Track Logger &amp; Cycle Configurator.</text>

