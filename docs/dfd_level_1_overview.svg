<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1260" width="100%" height="100%">
  <defs>
    <style type="text/css">
<![CDATA[
    svg { background-color: #ffffff; }
    .title-main { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 28px; font-weight: 800; fill: #1e293b; letter-spacing: -0.5px; }
    .title-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13.5px; fill: #475569; }
    .entity-box { fill: #f1f5f9; stroke: #334155; stroke-width: 1.6px; rx: 4px; ry: 4px; }
    .entity-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .entity-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10.5px; font-weight: 600; fill: #475569; text-anchor: middle; }
    .proc-bg { fill: #ffffff; stroke: #2563eb; stroke-width: 1.8px; rx: 8px; ry: 8px; }
    .proc-header { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.8px; }
    .proc-bottom { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.8px; }
    .proc-id-box { fill: #2563eb; stroke: #1d4ed8; stroke-width: 1.4px; rx: 3px; }
    .proc-id-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 800; fill: #ffffff; text-anchor: middle; }
    .proc-name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .store-id-box { fill: #475569; stroke: #334155; stroke-width: 1.6px; }
    .store-id-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 800; fill: #ffffff; text-anchor: middle; }
    .store-body { fill: #f8fafc; stroke: #475569; stroke-width: 1.6px; }
    .store-name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .flow-line { fill: none; stroke: #2563eb; stroke-width: 1.6px; stroke-linejoin: round; stroke-linecap: round; }
    .flow-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 8.5px; font-weight: 700; fill: #0f172a; letter-spacing: 0.3px; }
    .context-process { fill: #ffffff; stroke: #2563eb; stroke-width: 2.5px; }
    .context-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14.5px; font-weight: 800; fill: #1e3a8a; text-anchor: middle; }
    .context-id { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 800; fill: #2563eb; text-anchor: middle; }
    .footer-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 8.5px; font-weight: 600; fill: #94a3b8; text-anchor: end; letter-spacing: 0.5px; }
]]>
    </style>
  </defs>
  <!-- Pure White Clean Background for Easy Copying into Documents -->
  <rect width="100%" height="100%" fill="#ffffff" />
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 1.5L8 5 0 8.5z" fill="#2563eb"/></marker>
    
  </defs>
  
  

  <!-- Header -->
  <text x="600" y="68" class="title-main" text-anchor="middle">Level 1 Data Flow Diagram (Architecture v3.7.2)</text>
  <text x="600" y="92" class="title-sub" text-anchor="middle">Gane &amp; Sarson notation with 4 core processes: Ingestion, Room-Code System, Daily Telemetry, and Modeling &amp; Reconciliation.</text>

  <!-- External Entities -->
  <!-- Top Left Entities: User & Room Members -->
  <rect x="60" y="160" width="170" height="50" class="entity-box" rx="3"/>
  <text x="145" y="185" class="entity-text">User / Consumer</text>
  <text x="145" y="200" class="entity-sub">Account Owner</text>

  <rect x="60" y="290" width="170" height="50" class="entity-box" rx="3"/>
  <text x="145" y="315" class="entity-text">Room Collaborator</text>
  <text x="145" y="330" class="entity-sub">Household Member</text>

  <!-- Top Ingestion Sources -->
  <rect x="360" y="120" width="170" height="48" class="entity-box" rx="3"/>
  <text x="445" y="142" class="entity-text">Gemini 2.0 / Tesseract</text>
  <text x="445" y="156" class="entity-sub">Dual OCR Engines</text>

  <rect x="560" y="120" width="170" height="48" class="entity-box" rx="3"/>
  <text x="645" y="142" class="entity-text">DOE PELP / PC Registry</text>
  <text x="645" y="156" class="entity-sub">Ratings &amp; Hardware Specs</text>

  <!-- Right: Notification Service -->
  <rect x="940" y="550" width="180" height="50" class="entity-box" rx="3"/>
  <text x="1030" y="573" class="entity-text">Notification Service</text>
  <text x="1030" y="589" class="entity-sub">Web Push &amp; Resend Email</text>

  <!-- Left: Electric Utility -->
  <rect x="60" y="870" width="170" height="50" class="entity-box" rx="3"/>
  <text x="145" y="893" class="entity-text">Electric Utility</text>
  <text x="145" y="909" class="entity-sub">Meralco / ERC Rates</text>

  <!-- ==================== PROCESSES ==================== -->
  <!-- PROCESS 1: Appliance Ingestion & Specification System -->
  <g id="proc-1">
    <rect x="410" y="210" width="220" height="96" class="proc-bg"/>
    <path d="M410 218A8 8 0 01 418 210H622A8 8 0 01 630 218V235H410Z" class="proc-header"/>
    <rect x="410" y="210" width="34" height="25" class="proc-id-box"/>
    <text x="427" y="227" class="proc-id-text">1</text>
    <path d="M410 297H630V298A8 8 0 01 622 306H418A8 8 0 01 410 298Z" class="proc-bottom"/>
    <text x="520" y="260" class="proc-name">Appliance Ingestion</text>
    <text x="520" y="278" class="proc-name">&amp; Specification System</text>
  </g>

  <!-- PROCESS 2: Room-Code & Household Management (NEW) -->
  <g id="proc-2">
    <rect x="800" y="210" width="220" height="96" class="proc-bg"/>
    <path d="M800 218A8 8 0 01 808 210H1012A8 8 0 01 1020 218V235H800Z" class="proc-header"/>
    <rect x="800" y="210" width="34" height="25" class="proc-id-box"/>
    <text x="817" y="227" class="proc-id-text">2</text>
    <path d="M800 297H1020V298A8 8 0 01 1012 306H808A8 8 0 01 800 298Z" class="proc-bottom"/>
    <text x="910" y="260" class="proc-name">Room-Code &amp; Multi-Tenant</text>
    <text x="910" y="278" class="proc-name">Household Management</text>
  </g>

  <!-- PROCESS 3: Daily Usage, Live Board & Smart Calendar -->
  <g id="proc-3">
    <rect x="410" y="530" width="220" height="96" class="proc-bg"/>
    <path d="M410 538A8 8 0 01 418 530H622A8 8 0 01 630 538V555H410Z" class="proc-header"/>
    <rect x="410" y="530" width="34" height="25" class="proc-id-box"/>
    <text x="427" y="547" class="proc-id-text">3</text>
    <path d="M410 617H630V618A8 8 0 01 622 626H418A8 8 0 01 410 618Z" class="proc-bottom"/>
    <text x="520" y="578" class="proc-name">Daily Telemetry, Live Board</text>
    <text x="520" y="596" class="proc-name">&amp; Smart Calendar Engine</text>
  </g>

  <!-- PROCESS 4: Bottom-Up Energy Modeling, Tariff & Reconciliation -->
  <g id="proc-4">
    <rect x="410" y="870" width="220" height="96" class="proc-bg"/>
    <path d="M410 878A8 8 0 01 418 870H622A8 8 0 01 630 878V895H410Z" class="proc-header"/>
    <rect x="410" y="870" width="34" height="25" class="proc-id-box"/>
    <text x="427" y="887" class="proc-id-text">4</text>
    <path d="M410 957H630V958A8 8 0 01 622 966H418A8 8 0 01 410 958Z" class="proc-bottom"/>
    <text x="520" y="918" class="proc-name">Bottom-Up Energy Modeling,</text>
    <text x="520" y="936" class="proc-name">Tariff &amp; Reconciliation</text>
  </g>

  <!-- ==================== DATA STORES ==================== -->
  <!-- D1: Rooms & Members -->
  <g><rect x="800" y="370" width="36" height="46" class="store-id-box"/><text x="818" y="398" class="store-id-text">D1</text><rect x="836" y="370" width="184" height="46" class="store-body"/><text x="928" y="398" class="store-name">Rooms &amp; Room Members</text></g>

  <!-- D2: User Accounts & Cache -->
  <g><rect x="800" y="120" width="36" height="46" class="store-id-box"/><text x="818" y="148" class="store-id-text">D2</text><rect x="836" y="120" width="184" height="46" class="store-body"/><text x="928" y="148" class="store-name">User Accounts &amp; Profiles</text></g>

  <!-- D3: User Appliances (Cruising & Duty Specs) -->
  <g><rect x="180" y="420" width="36" height="46" class="store-id-box"/><text x="198" y="448" class="store-id-text">D3</text><rect x="216" y="420" width="190" height="46" class="store-body"/><text x="311" y="448" class="store-name">User Appliances (Cruising Specs)</text></g>

  <!-- ROW OF DATA STORES (Below Process 3) -->
  <!-- D4: Actual Daily Appliance Usage -->
  <g><rect x="180" y="690" width="36" height="46" class="store-id-box"/><text x="198" y="718" class="store-id-text">D4</text><rect x="216" y="690" width="180" height="46" class="store-body"/><text x="306" y="718" class="store-name">Actual Daily Usage (Measured)</text></g>

  <!-- D5: Simulated Usage & Calendar Plans -->
  <g><rect x="420" y="690" width="36" height="46" class="store-id-box"/><text x="438" y="718" class="store-id-text">D5</text><rect x="456" y="690" width="180" height="46" class="store-body"/><text x="546" y="718" class="store-name">Simulated Plans &amp; Schedules</text></g>

  <!-- D6: Live Stopwatch Sessions -->
  <g><rect x="660" y="690" width="36" height="46" class="store-id-box"/><text x="678" y="718" class="store-id-text">D6</text><rect x="696" y="690" width="160" height="46" class="store-body"/><text x="776" y="718" class="store-name">Live Stopwatch Sessions</text></g>

  <!-- D7: Meralco Tariff Matrix -->
  <g><rect x="880" y="690" width="36" height="46" class="store-id-box"/><text x="898" y="718" class="store-id-text">D7</text><rect x="916" y="690" width="150" height="46" class="store-body"/><text x="991" y="718" class="store-name">Meralco Tariff Matrix</text></g>

  <!-- D8: Reconciled Metrics & Unbundled Bills -->
  <g><rect x="410" y="1050" width="36" height="46" class="store-id-box"/><text x="428" y="1078" class="store-id-text">D8</text><rect x="446" y="1050" width="220" height="46" class="store-body"/><text x="556" y="1078" class="store-name">Reconciled Forecasts &amp; MAPE Metrics</text></g>

  <!-- ==================== DATA FLOWS ==================== -->
  <!-- Process 2 (Rooms) Flows -->
  <path d="M230 185 L792 185" class="flow-line" marker-end="url(#a1)"/>
  <text x="250" y="178" class="flow-text">PROVISION ROOM &amp; MANAGE MEMBERS</text>

  <path d="M230 315 L792 315" class="flow-line" marker-end="url(#a1)"/>
  <text x="250" y="308" class="flow-text">JOIN VIA 6-CHAR CODE (PF-XXXXXX)</text>

  <line x1="910" y1="306" x2="910" y2="362" class="flow-line" marker-end="url(#a1)"/>
  <text x="918" y="340" class="flow-text">ROOM &amp; MEMBER ROLES</text>

  <line x1="910" y1="210" x2="910" y2="174" class="flow-line" marker-end="url(#a1)"/>
  <text x="918" y="195" class="flow-text">SCOPED USER CONTEXT</text>

  <!-- Process 1 (Ingestion) Flows -->
  <line x1="230" y1="205" x2="402" y2="245" class="flow-line" marker-end="url(#a1)"/>
  <text x="240" y="220" class="flow-text">3-PHOTO STAGING, MANUAL SPECS, PC BUILDER</text>

  <line x1="445" y1="168" x2="445" y2="202" class="flow-line" marker-end="url(#a1)"/>
  <text x="448" y="188" class="flow-text">OCR SPECS</text>

  <line x1="600" y1="168" x2="560" y2="202" class="flow-line" marker-end="url(#a1)"/>
  <text x="585" y="188" class="flow-text">CSPF &amp; TDP/TGP</text>

  <path d="M410 270 L300 270 L300 412" class="flow-line" marker-end="url(#a1)"/>
  <text x="308" y="360" class="flow-text">SAVE APPLIANCE WITH CRUISING WATTS</text>

  <path d="M800 395 L720 395 L720 280 L638 280" class="flow-line" marker-end="url(#a1)"/>
  <text x="690" y="385" class="flow-text">ACTIVE ROOM SCOPING</text>

  <!-- Process 1 -> Process 3 (Spine) -->
  <line x1="520" y1="306" x2="520" y2="522" class="flow-line" marker-end="url(#a1)"/>
  <text x="528" y="420" class="flow-text">RATED WATTAGE, DUTY CYCLES &amp; CRUISING ATTRIBUTES</text>

  <!-- Process 3 (Telemetry & Calendar) Flows -->
  <path d="M200 210 L160 210 L160 560 L402 560" class="flow-line" marker-end="url(#a1)"/>
  <text x="170" y="540" class="flow-text">CIRCUIT TOGGLES, WORKLOAD MODES &amp; CALENDAR EDITS</text>

  <path d="M376 466 L376 545 L402 545" class="flow-line" marker-end="url(#a1)"/>
  <text x="280" y="525" class="flow-text">CRUISING LOAD SPECS</text>

  <path d="M480 626 L480 655 L280 655 L280 682" class="flow-line" marker-end="url(#a1)"/>
  <text x="290" y="650" class="flow-text">LOGGED ACTUAL KWH</text>

  <line x1="520" y1="626" x2="520" y2="682" class="flow-line" marker-end="url(#a1)"/>
  <text x="528" y="660" class="flow-text">SIMULATED SCHEDULE PLANS</text>

  <path d="M570 626 L570 655 L750 655 L750 682" class="flow-line" marker-end="url(#a1)"/>
  <text x="590" y="650" class="flow-text">LIVE RUNNING SESSIONS</text>

  <path d="M630 560 L932 560" class="flow-line" marker-end="url(#a1)"/>
  <text x="660" y="552" class="flow-text">BUDGET, PEAK &amp; CRUISING ALERTS</text>

  <!-- Process 4 (Modeling & Reconciliation) Flows -->
  <path d="M280 736 L280 820 L440 820 L440 862" class="flow-line" marker-end="url(#a1)"/>
  <text x="290" y="812" class="flow-text">MTD ACTUAL USAGE</text>

  <line x1="520" y1="736" x2="520" y2="862" class="flow-line" marker-end="url(#a1)"/>
  <text x="528" y="800" class="flow-text">REMAINING DAYS BASELINE PROJECTION</text>

  <line x1="230" y1="895" x2="402" y2="895" class="flow-line" marker-end="url(#a1)"/>
  <text x="245" y="888" class="flow-text">MERALCO TARIFF RATES &amp; SCHEDULES</text>

  <path d="M410 930 L160 930 L160 920 L238 920" class="flow-line" marker-end="url(#a1)"/>
  <text x="245" y="940" class="flow-text">ESTIMATED GRID DEMAND</text>

  <path d="M960 736 L960 910 L638 910" class="flow-line" marker-end="url(#a1)"/>
  <text x="750" y="902" class="flow-text">7-PART UNBUNDLED MATRIX</text>

  <line x1="520" y1="966" x2="520" y2="1042" class="flow-line" marker-end="url(#a1)"/>
  <text x="528" y="1005" class="flow-text">ITEMIZED ERC BILL &amp; MAPE SCORE (≥90%)</text>

  <!-- Returns to User -->
  <path d="M410 915 L80 915 L80 218 L140 218" class="flow-line" marker-end="url(#a1)"/>
  <text x="90" y="700" class="flow-text" transform="rotate(-90 90 700)">VERIFIED ACCURACY BADGE, WHAT-IF SIMULATOR &amp; AI ENERGY AUDIT TIPS</text>

  <text x="1140" y="1225" class="footer-text">© 2026 POWERFORECAST REFINE — LEVEL 1 DFD ARCHITECTURE v3.7.2</text>
</svg>